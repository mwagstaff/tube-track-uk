# Prometheus alert rules for tube-track-api. Installed on the monitoring host
# as rules/tube-track-api.yml by deploy/node_project.zsh (full deploy) and
# delivered by Alertmanager; see server-tooling/monitoring/install-alerting.zsh.
# The generic rules (TargetDown, AppCheckFailing on app_check_ok) also apply.
groups:
  - name: tube-track-api
    rules:
      - alert: TubeTrackLiveCacheStale
        expr: tube_track_live_cache_age_seconds{job="tube-track-api"} > 300
        for: 5m
        labels:
          severity: warning
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api live arrivals are {{ $value | humanizeDuration }} old'
          description: >-
            The live cache has not refreshed for over 5 minutes, so clients are
            showing stale departures flagged with meta.stale=true. Check
            /healthcheck (polling.refreshing, lastError) and the
            live_cache_stale log lines.

      - alert: TubeTrackLiveCacheStaleCritical
        expr: tube_track_live_cache_age_seconds{job="tube-track-api"} > 1800
        for: 5m
        labels:
          severity: critical
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api live arrivals are {{ $value | humanizeDuration }} old'
          description: >-
            The live cache has been stale for over 30 minutes. Every
            expectedArrival served is in the past; the poller is most likely
            wedged or TfL is down. Restart the service if lastError is empty
            and refreshing stays true.

      - alert: TubeTrackLiveRefreshFailing
        expr: >-
          sum(increase(tube_track_live_refreshes_total{job="tube-track-api",status=~"failure|timeout|partial"}[15m]))
            /
          clamp_min(sum(increase(tube_track_live_refreshes_total{job="tube-track-api"}[15m])), 1)
            > 0.5
        for: 15m
        labels:
          severity: warning
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api: over half of live refreshes were incomplete in the last 15m'
          description: >-
            {{ $value | humanizePercentage }} of refresh attempts failed, timed
            out, or updated only some modes. Check tube_track_tfl_requests_total
            by source and status; healthy modes keep updating independently.

      - alert: TubeTrackPushSendFailing
        expr: >-
          sum(increase(tube_track_push_sent_total{job="tube-track-api",result!="ok"}[15m]))
            /
          clamp_min(sum(increase(tube_track_push_sent_total{job="tube-track-api"}[15m])), 1)
            > 0.25
        for: 15m
        labels:
          severity: warning
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api: {{ $value | humanizePercentage }} of pushes failed in the last 15m'
          description: >-
            Live Activity pushes are being rejected. Break down by result:
            "dead" is normal churn as activities end; a spike in "rejected"
            usually means the provider token or topic is wrong, and
            "retryable" means APNs is throttling or degraded. Passengers see
            departure boards that dim and stop updating.

      - alert: TubeTrackPushStoreWriteFailing
        expr: increase(tube_track_push_store_write_failures_total{job="tube-track-api"}[30m]) > 0
        for: 5m
        labels:
          severity: warning
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api cannot write its push token store'
          description: >-
            The token store has failed to write to disk. Registrations still
            work in memory but will not survive a restart. Check the data
            directory exists and is writable — it lives outside the project
            directory precisely because deploys rsync --delete over that.

      - alert: TubeTrackPushBudgetExhausted
        expr: >-
          sum(increase(tube_track_push_suppressed_total{job="tube-track-api"}[1h])) > 20
        for: 30m
        labels:
          severity: warning
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api is withholding Live Activity pushes to stay inside the iOS budget'
          description: >-
            {{ $value }} pushes were suppressed in the last hour. Tracked
            boards are changing faster than the ~8 pushes/hour iOS allows, so
            passengers will see boards dim between updates. Check whether
            predictions are flapping (tube_track_push_changes_detected_total by
            reason) before raising the thresholds.

      - alert: TubeTrackPushRegistrationFlood
        expr: >-
          sum(increase(tube_track_push_rate_limited_total{job="tube-track-api"}[15m])) > 100
        for: 15m
        labels:
          severity: warning
          service_name: tube-track-api
        annotations:
          summary: 'tube-track-api is rate-limiting push registrations heavily'
          description: >-
            {{ $value }} registration attempts were rejected in the last 15
            minutes. These endpoints are deliberately unauthenticated, so the
            rate limiter is the only thing bounding abuse — a sustained flood
            here is the signal that it needs App Attest rather than a higher
            limit. Check tube_track_push_tokens for eviction of real
            subscriptions.
